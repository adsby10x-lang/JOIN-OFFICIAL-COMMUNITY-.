<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{

width:100%;
max-width:380px;
background:#ffffff;
border-radius:24px;
padding:28px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.35);

}

.badge{

display:inline-block;
background:#eef4ff;
color:#2563eb;
padding:8px 16px;
border-radius:50px;
font-size:13px;
font-weight:700;
margin-bottom:18px;

}

.dp{

width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:5px solid #2563eb;
box-shadow:0 10px 25px rgba(37,99,235,.25);

}

h1{

margin-top:20px;
font-size:28px;
font-weight:800;
color:#111827;

}

p{

margin-top:14px;
font-size:15px;
color:#6b7280;
line-height:1.7;

}

.features{

margin-top:25px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;

}

.box{

background:#f5f7fb;
padding:12px;
border-radius:12px;
font-size:14px;
font-weight:600;
color:#374151;

}

.btn{

display:block;
margin-top:30px;
text-decoration:none;
background:#2563eb;
color:#fff;
padding:16px;
border-radius:14px;
font-size:18px;
font-weight:800;
transition:.3s;
box-shadow:0 12px 25px rgba(37,99,235,.35);

}

.btn:hover{

transform:translateY(-2px);

}

.footer{

margin-top:18px;
font-size:12px;
color:#9ca3af;

}

</style>

<body>

<div class="card">

<div class="badge">
OFFICIAL COMMUNITY
</div>

<h1>Welcome!</h1>

<p>
Join our official Telegram community to stay connected and receive the latest updates and announcements.
</p>

<div class="features">

<div class="box">Latest Updates</div>
<div class="box">Community</div>
<div class="box">Announcements</div>
<div class="box">Support</div>

</div>

<a class="btn" href="https://t.me/+Gi00hlpzesE3YzU1" target="_blank">

</a>

<div class="footer">
Thank you for being part of our community.
</div>

</div>
